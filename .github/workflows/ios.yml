name: iOS build
on:
  push:
    branches: [ios]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ios, cancel-in-progress: true }
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version | tee ci.log
      - name: Test tracks (tests/make_tracks.py, checked against the ones the fixtures came from)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy 2>&1 | tail -3 | tee -a ci.log
          mkdir -p "$RUNNER_TEMP/music"
          "$RUNNER_TEMP/venv/bin/python" tests/make_tracks.py "$RUNNER_TEMP/music" 2>&1 | tail -5 | tee -a ci.log
          (cd "$RUNNER_TEMP/music" && md5 -r *.wav | sed 's/ /  /') | tee md5.txt
          diff <(sort md5.txt) <(sort ios/CrateboxKit/Tests/CrateboxKitTests/Fixtures/music.md5) | tee -a ci.log || echo "TRACKS DIFFER from the fixtures' (numpy?)" | tee -a ci.log
      - name: Core tests (swift test, optimised)
        run: |
          set -o pipefail
          cd ios/CrateboxKit && CRATEBOX_MUSIC="$RUNNER_TEMP/music" swift test -c release -Xswiftc -enable-testing 2>&1 | tee -a ../../ci.log
      - name: Error summary to the ci-logs branch
        if: always()
        run: |
          { echo "run ${{ github.run_id }} sha ${{ github.sha }} at $(date -u)"; grep -E "error:|warning: unre|FAIL|failed|Executed|BUILD|passed|DSP |ANALYSIS |TRACKS |ENGINE |\*\* " ci.log | head -300; echo "---- tail"; tail -80 ci.log; } > summary.txt || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git fetch origin ci-logs || true
          git checkout --orphan ci-tmp && git rm -rfq --cached . >/dev/null
          cp summary.txt ios-latest.txt
          git add -f ios-latest.txt && git commit -qm "ios ci ${{ github.run_id }}" && git push -qf origin HEAD:ci-logs
