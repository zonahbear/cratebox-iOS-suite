name: iOS build
# Manual only (Actions → iOS build → Run workflow, pick the branch): each run costs ~130 of the private repo's
# monthly minutes (macOS counts 10x). TestFlight (testflight.yml) is the normal install route now.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: "ios-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          brew install coreutils >/dev/null 2>&1 || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version | tee ci.log
      - name: Test tracks (tests/make_tracks.py, checked against the ones the fixtures came from)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy 2>&1 | tail -3 | tee -a ci.log
          mkdir -p "$RUNNER_TEMP/music"
          "$RUNNER_TEMP/venv/bin/python" tests/make_tracks.py "$RUNNER_TEMP/music" 2>&1 | tail -5 | tee -a ci.log
          (cd "$RUNNER_TEMP/music" && md5 -r *.wav | sed 's/ /  /') | tee md5.txt
          diff <(sort md5.txt) <(sort ios/CrateboxKit/Tests/CrateboxKitTests/Fixtures/music.md5) | tee -a ci.log || echo "TRACKS DIFFER from the fixtures' (numpy?)" | tee -a ci.log
      - name: Core tests (swift test, optimised)
        continue-on-error: true
        run: |
          set -o pipefail
          cd ios/CrateboxKit && CRATEBOX_MUSIC="$RUNNER_TEMP/music" swift test -c release -Xswiftc -enable-testing 2>&1 | tee -a ../../ci.log
      - name: App (unsigned IPA)
        id: app
        run: |
          set -o pipefail
          brew install xcodegen >/dev/null 2>&1 || true
          cd ios && xcodegen generate 2>&1 | tail -3 | tee -a ../ci.log
          xcodebuild -project Cratebox.xcodeproj -scheme Cratebox -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee "$RUNNER_TEMP/xcb.log" | grep -E "error:|warning: .*(deprecated|never used)|BUILD (SUCCEEDED|FAILED)" | head -150 | tee -a ../ci.log
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload" && cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr ../CrateboxSuite.ipa Payload)
          ls -la "$RUNNER_TEMP/CrateboxSuite.ipa" | tee -a ../ci.log
      - name: Publish the IPA (release "ios-latest", main only, never from preview branches)
        if: steps.app.outcome == 'success' && github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --prerelease --target main --title "Cratebox iOS Suite (latest build)" --notes "Unsigned build of cratebox-iOS-suite main. Install with SideStore or AltStore."
          gh release upload ios-latest "$RUNNER_TEMP/CrateboxSuite.ipa" --clobber
          gh release edit ios-latest --notes "Unsigned build of cratebox-iOS-suite main, commit ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d\ %H:%M) UTC). Install with SideStore or AltStore." 
          echo "PUBLISHED ios-latest from ${GITHUB_SHA::7}" | tee -a ci.log
      - name: Publish a preview IPA (its own release per branch, "ios-preview-<branch>", preview branches only)
        if: steps.app.outcome == 'success' && startsWith(github.ref, 'refs/heads/preview/')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # one release per preview branch, so two branches in flight don't overwrite each other's IPA
          NAME="${GITHUB_REF_NAME#preview/}"; TAG="ios-preview-${NAME//\//-}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target main --title "Cratebox iOS Suite (preview: ${NAME})" --notes "Preview build of ${GITHUB_REF_NAME} for testing before it goes to main."
          gh release upload "$TAG" "$RUNNER_TEMP/CrateboxSuite.ipa" --clobber
          gh release edit "$TAG" --notes "Preview build of ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d\ %H:%M) UTC), for testing before it goes to main. Install with SideStore or AltStore." 
          echo "PUBLISHED $TAG from ${GITHUB_SHA::7}" | tee -a ci.log
      - name: Launch in the simulators (screenshots)
        if: steps.app.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          cd ios
          xcodebuild -project Cratebox.xcodeproj -scheme Cratebox -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dds" CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD" | tee -a ../ci.log
          APP=$(ls -d "$RUNNER_TEMP"/dds/Build/Products/Release-iphonesimulator/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/shots"
          for dev in "iPhone 16 Pro Max" "iPad Pro 13-inch (M4)"; do
            UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for r in d.values() for x in r if x['name']=='$dev'), ''))")
            [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for r in d.values() for x in r if x['name'].startswith('${dev%% *}')), ''))")
            echo "SIM $dev $UDID" | tee -a ../ci.log
            xcrun simctl boot "$UDID" || true
            [ "${dev%% *}" = iPhone ] && xcrun simctl ui "$UDID" appearance dark || true
            gtimeout 240 xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1 || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo | tee -a ../ci.log
            sleep 25
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q cratebox && echo "SIM RUNNING $dev" | tee -a ../ci.log || echo "SIM NOT RUNNING $dev (crashed?)" | tee -a ../ci.log
            n=$(echo "$dev" | tr ' ()' '___')
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$n.png" || true
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -four > /dev/null || true
            sleep 20
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_4decks.png" || true
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -browse > /dev/null || true
            sleep 20
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_browse.png" || true
            # WAVE mode, 2 and 4 decks (deck 1 playing, so the FLX4 lanes glow)
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -wave > /dev/null || true
            sleep 20
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_wave.png" || true
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -four -wave > /dev/null || true
            sleep 20
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_wave4.png" || true
            # HEAT (TrueCurve mini) on the simulator device, preheating to the Quartz Banger's 520°F while the demo plays
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -heat > /dev/null || true
            sleep 25
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_heat.png" || true
            # the suite's other two modes: Deck Bridge, and Cratebox USB on a copy of the test stick (no audio: the scan flags it)
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -bridge > /dev/null || true
            sleep 12
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_bridge.png" || true
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            DATA=$(xcrun simctl get_app_container "$UDID" com.zonahbear.cratebox.suite data 2>/dev/null || true)
            if [ -n "$DATA" ]; then mkdir -p "$DATA/Documents/DemoUSB" && cp -R ../tests/fixtures/rekordbox_usb/PIONEER "$DATA/Documents/DemoUSB/"; fi
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -usb -demo > /dev/null || true
            sleep 25
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_usb.png" || true
            gtimeout 60 xcrun simctl spawn "$UDID" log show --last 1m --predicate 'process == "Cratebox"' --style compact 2>/dev/null | grep -iE "fault|crash|fatal" | head -10 | tee -a ../ci.log || true
            gtimeout 60 xcrun simctl spawn "$UDID" log show --last 1m --predicate 'process == "Cratebox"' --style compact 2>/dev/null | grep -iE "fault|error|crash|fatal|DEMO MIDI" | head -20 | tee -a ../ci.log || true
            xcrun simctl shutdown "$UDID" || true
          done
          ls "$RUNNER_TEMP/shots" | tee -a ../ci.log
      - name: Error summary to the ci-logs branch (ci-logs-preview for preview branches)
        if: always()
        env: { LOGS: "${{ github.ref == 'refs/heads/main' && 'ci-logs' || 'ci-logs-preview' }}" }
        run: |
          { echo "run ${{ github.run_id }} sha ${{ github.sha }} at $(date -u)"; grep -E "error:|warning: unre|FAIL|failed|Executed|BUILD|passed|DSP |ANALYSIS |TRACKS |ENGINE |SYNC |PUBLISHED|CrateboxSuite.ipa|SIM |DEMO MIDI|\*\* " ci.log | head -300; echo "---- tail"; tail -80 ci.log; } > summary.txt || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git fetch origin "$LOGS" || true
          git checkout --orphan ci-tmp && git rm -rfq --cached . >/dev/null
          cp summary.txt ios-latest.txt
          mkdir -p shots && cp "$RUNNER_TEMP"/shots/*.png shots/ 2>/dev/null || true
          git add -f ios-latest.txt shots && git commit -qm "ios ci ${{ github.run_id }}" && git push -qf origin "HEAD:$LOGS"
