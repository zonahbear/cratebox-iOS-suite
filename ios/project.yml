# XcodeGen project (CI runs `xcodegen generate` in ios/). ios.yml builds unsigned (SideStore / AltStore sign the IPA);
# testflight.yml turns signing on for the app target through the CB_* settings below.
name: Cratebox
options:
  bundleIdPrefix: com.zonahbear
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  CrateboxKit:
    path: CrateboxKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  Cratebox:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: CrateboxKit
      # Cratebox Mic, the watch-mic experiment (personal/heat only), embedded in the app
      - target: CrateboxMic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cratebox HEAT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio, bluetooth-central]
        NSLocalNetworkUsageDescription: Cratebox listens on your Wi-Fi for the Cratebox Mic watch app's voice.
        NSBonjourServices: [_cbwatchmic._udp]
        NSBluetoothAlwaysUsageDescription: The HEAT button (TrueCurve) talks to your Puffco over Bluetooth to read and set its temperature.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zonahbear.cratebox.heat
        SWIFT_OBJC_BRIDGING_HEADER: App/Cratebox-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CB_* are set only by testflight.yml. Signing is switched on here, for the app alone, rather than on the
        # command line: forced on there it also signs the package's resource bundle, which codesign rejects.
        CODE_SIGNING_ALLOWED: $(CB_SIGN)
        CODE_SIGNING_REQUIRED: $(CB_SIGN)
        CODE_SIGN_IDENTITY: $(CB_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(CB_PROFILE_NAME)
        ENABLE_PREVIEWS: "NO"
  # Cratebox Mic: the Apple Watch as a live mic (experiment, personal/heat only). Streams only during a CallKit call,
  # the one time watchOS allows its own network connection. Signed with its own profile (testflight.yml, CB_WATCH_*).
  CrateboxMic:
    type: application
    platform: watchOS
    sources: [WatchMic, Shared]
    info:
      path: WatchMic/Info.plist
      properties:
        CFBundleDisplayName: Cratebox Mic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.zonahbear.cratebox.heat
        UIBackgroundModes: [voip, audio]
        NSMicrophoneUsageDescription: Cratebox Mic sends your voice to Cratebox on your iPhone while you're live.
        NSLocalNetworkUsageDescription: Cratebox Mic finds Cratebox on your iPhone over the network.
        NSBonjourServices: [_cbwatchmic._udp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zonahbear.cratebox.heat.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: $(CB_SIGN)
        CODE_SIGNING_REQUIRED: $(CB_SIGN)
        CODE_SIGN_IDENTITY: $(CB_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(CB_WATCH_PROFILE_NAME)
        ENABLE_PREVIEWS: "NO"
