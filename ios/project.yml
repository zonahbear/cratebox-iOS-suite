# XcodeGen project (CI runs `xcodegen generate` in ios/). ios.yml builds unsigned (SideStore / AltStore sign the IPA);
# testflight.yml turns signing on from the command line and names the profile through CB_PROFILE_NAME.
name: Cratebox
options:
  bundleIdPrefix: com.zonahbear
  deploymentTarget:
    iOS: "17.0"
packages:
  CrateboxKit:
    path: CrateboxKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  Cratebox:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CrateboxKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cratebox Suite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zonahbear.cratebox.suite
        SWIFT_OBJC_BRIDGING_HEADER: App/Cratebox-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # set only by testflight.yml; here rather than on the command line so the package targets never get a profile
        PROVISIONING_PROFILE_SPECIFIER: $(CB_PROFILE_NAME)
        ENABLE_PREVIEWS: "NO"
